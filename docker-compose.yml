version: '3.8'

services:
  # PHP-Apache Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vioraa-web
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_key_here}
      - ECF_API_KEY=${ECF_API_KEY:-your_ecf_key_here}
      - DB_HOST=db
      - DB_USER=viora_user
      - DB_PASSWORD=${DB_PASSWORD:-vioraa_password}
      - DB_NAME=viora
      - PHP_ENV=development
    volumes:
      - ./Viora:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./apache-config.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      - db
    networks:
      - vioraa-network
    restart: unless-stopped

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: vioraa-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=viora
      - MYSQL_USER=viora_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-vioraa_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bd/viora.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vioraa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PhpMyAdmin for database management (optional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vioraa-phpmyadmin
    environment:
      - PMA_HOST=db
      - PMA_USER=viora_user
      - PMA_PASSWORD=${DB_PASSWORD:-vioraa_password}
      - PMA_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - vioraa-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  vioraa-network:
    driver: bridge

# Usage:
# docker-compose --env-file .env up -d
# Access:
# - VIORA: http://localhost:8080
# - PhpMyAdmin: http://localhost:8081
# - Database: localhost:3306
