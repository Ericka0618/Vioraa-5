services:
  web:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_HOST: db
      DB_USER: viora_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private .env}
      DB_NAME: viora
      ECF_ENABLED: "false"
      PAYPAL_MODE: sandbox
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_PLAN_ID: ${PAYPAL_PLAN_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/var/www/html/uploads
      - documents:/var/www/viora_documentos_privados
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in your private .env}
      MYSQL_DATABASE: viora
      MYSQL_USER: viora_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  uploads:
  documents:
