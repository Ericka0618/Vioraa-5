options:
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/$PROJECT_ID/serviceAccounts/viora-build@$PROJECT_ID.iam.gserviceaccount.com
steps:
- name: gcr.io/cloud-builders/docker
  id: cache
  entrypoint: bash
  args:
  - -c
  - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:staging-initial || true
- name: gcr.io/cloud-builders/docker
  id: build
  args:
  - build
  - --cache-from
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:staging-initial
  - -t
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
  - .
- name: gcr.io/cloud-builders/docker
  id: push
  args:
  - push
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
- args:
  - run
  - deploy
  - viora
  - --project=$PROJECT_ID
  - --region=${_REGION}
  - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
  - --service-account=viora-production@$PROJECT_ID.iam.gserviceaccount.com
  - --execution-environment=gen2
  - --port=8080
  - --memory=512Mi
  - --cpu=1
  - --min-instances=0
  - --max-instances=2
  - --concurrency=20
  - --timeout=300
  - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:viora-staging-db
  - --update-env-vars=APP_ENV=production,DB_HOST=localhost,DB_SOCKET=/cloudsql/$PROJECT_ID:${_REGION}:viora-staging-db,DB_USER=viora_prod,DB_NAME=viora_production,DB_SESSION_ENABLED=true,ECF_ENABLED=false,PAYPAL_MODE=sandbox
  - --update-secrets=DB_PASSWORD=viora-production-db-password:latest,PAYPAL_CLIENT_ID=viora-production-paypal-client-id:latest,PAYPAL_CLIENT_SECRET=viora-production-paypal-client-secret:latest,PAYPAL_PLAN_ID=viora-production-paypal-plan-id:latest,GEMINI_API_KEY=viora-production-gemini-api-key:latest
  - --add-volume=name=uploads,type=cloud-storage,bucket=$PROJECT_ID-production-uploads,mount-options=uid=33;gid=33;file-mode=664;dir-mode=775
  - --add-volume-mount=volume=uploads,mount-path=/var/www/html/uploads
  - --add-volume=name=documents,type=cloud-storage,bucket=$PROJECT_ID-production-documents,mount-options=uid=33;gid=33;file-mode=660;dir-mode=770
  - --add-volume-mount=volume=documents,mount-path=/var/www/viora_documentos_privados
  - --quiet
  entrypoint: gcloud
  id: deploy-production
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
substitutions:
  _IMAGE_TAG: manual
  _REGION: us-central1
timeout: 1800s
images:
- ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
