[PHP]
; Display errors safely
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Session configuration
session.gc_maxlifetime = 3600
session.name = VIORASID

; File uploads
file_uploads = On
upload_tmp_dir = /tmp
max_file_uploads = 20
upload_max_filesize = 50M
post_max_size = 50M

; Memory and execution
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Database
mysqli.max_links = -1
mysqli.max_persistent = -1
mysqli.default_port = 3306
mysqli.default_socket =

; Security
expose_php = Off
open_basedir = /var/www:/tmp:/etc/viora:/cloudsql
disable_functions = system,exec,shell_exec,passthru,proc_open,proc_close,proc_get_status,checkdnsrr,getmxrr

; Date and locale
date.timezone = "America/Santo_Domingo"

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
auto_prepend_file = /etc/viora/runtime.php
