name: VIORA - Production on Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: viora-production
  cancel-in-progress: false
jobs:
  deploy-production:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: viora-github@viora-514300.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build Docker and deploy through Cloud Build
        run: >-
          gcloud builds submit . --project=viora-514300 --region=us-central1
          --config=cloudbuild.yaml
          --gcs-source-staging-dir=gs://viora-514300-build-source/source
          --substitutions=_IMAGE_TAG=${{ github.sha }}
      - name: Output HTTPS URL
        run: >-
          gcloud run services describe viora --project=viora-514300
          --region=us-central1 --format='value(status.url)'
