name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: vioraa-5

jobs:
  setup-build-deploy:
    name: Setup, Build, and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest \
            -f Dockerfile \
            .

      - name: Push Docker image to Container Registry
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --region=$GCP_REGION \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --timeout=3600 \
            --set-env-vars=\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          ECF_API_KEY=${{ secrets.ECF_API_KEY }},\
          DB_HOST=${{ secrets.DB_HOST }},\
          DB_USER=${{ secrets.DB_USER }},\
          DB_PASSWORD=${{ secrets.DB_PASSWORD }},\
          DB_NAME=${{ secrets.DB_NAME }}

      - name: Output Cloud Run URL
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region=$GCP_REGION \
            --format='value(status.url)')
          echo "Service deployed at: $URL"
          echo "SERVICE_URL=$URL" >> $GITHUB_OUTPUT

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ VIORA deployed successfully to: ${{ steps.deploy.outputs.SERVICE_URL }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above."
          exit 1
