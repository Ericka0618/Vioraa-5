# Private job created with explicit cost approval; use configure-paypal-scheduler.py for setup.
# Immutable image of the approved deployed PayPal release.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: viora-paypal-reconcile
spec:
  template:
    spec:
      taskCount: 1
      template:
        metadata:
          annotations:
            run.googleapis.com/cloudsql-instances: viora-514300:us-central1:viora-staging-db
        spec:
          serviceAccountName: viora-production@viora-514300.iam.gserviceaccount.com
          timeoutSeconds: 300
          maxRetries: 1
          containers:
          - image: us-central1-docker.pkg.dev/viora-514300/viora/web@sha256:0bf79979bdeaab1d830ed4187f05e441c22ce6ed3804cfcca7b019e90651bb88
            command: [php]
            args: [-d, 'open_basedir=/var/www:/tmp:/etc/viora:/cloudsql:/opt/viora', /opt/viora/reconcile-paypal.php]
            resources:
              limits: {cpu: '1', memory: 512Mi}
            env:
            - {name: VIORA_APP_ROOT, value: /var/www/html}
            - {name: DB_HOST, value: localhost}
            - {name: DB_SOCKET, value: /cloudsql/viora-514300:us-central1:viora-staging-db}
            - {name: DB_NAME, value: viora_production}
            - {name: DB_USER, value: viora_prod}
            - {name: DB_SESSION_ENABLED, value: 'false'}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: viora-production-db-password, key: latest}}
            - name: PAYPAL_CLIENT_ID
              valueFrom: {secretKeyRef: {name: viora-production-paypal-client-id, key: latest}}
            - name: PAYPAL_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: viora-production-paypal-client-secret, key: latest}}
            - name: PAYPAL_PLAN_ID
              valueFrom: {secretKeyRef: {name: viora-production-paypal-plan-id, key: latest}}
