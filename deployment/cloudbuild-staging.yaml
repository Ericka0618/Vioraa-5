steps:
- name: gcr.io/cloud-builders/docker
  id: cache
  entrypoint: bash
  args:
  - -c
  - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:staging-initial || true
- name: gcr.io/cloud-builders/docker
  id: build
  args:
  - build
  - --cache-from
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:staging-initial
  - -t
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
  - .
- name: gcr.io/cloud-builders/docker
  id: verify-container
  entrypoint: bash
  args:
  - -euc
  - "image=\"${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}\"\ndocker run --rm --entrypoint php \"$$image\" -r 'foreach ([\"mysqli\",\"pdo_mysql\",\"mbstring\",\"curl\",\"zip\",\"gd\",\"dom\",\"fileinfo\"] as $$e) { if (!extension_loaded($$e)) { fwrite(STDERR, $$e); exit(1); } }'\ndocker run --rm --entrypoint sh \"$$image\" -c 'find /var/www/html /etc/viora -name \"*.php\" -exec php -l {} \\; > /tmp/lint.log; if grep -E \"(Parse error|Errors parsing)\" /tmp/lint.log; then exit 1; fi; apache2ctl -t'\ndocker run -d --name viora-check \"$$image\"\ntrap 'docker rm -f viora-check >/dev/null' EXIT\nfor attempt in $$(seq 1 30); do\n  if docker exec viora-check curl -fsS http://localhost:8080/healthz.php; then exit 0; fi\n  sleep 1\ndone\nexit 1\n"
- name: gcr.io/cloud-builders/docker
  id: push
  args:
  - push
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  id: deploy-staging
  entrypoint: gcloud
  args:
  - run
  - deploy
  - viora-staging
  - --project=$PROJECT_ID
  - --region=${_REGION}
  - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
  - --service-account=viora-staging@$PROJECT_ID.iam.gserviceaccount.com
  - --execution-environment=gen2
  - --port=8080
  - --memory=512Mi
  - --cpu=1
  - --min-instances=0
  - --max-instances=2
  - --concurrency=20
  - --timeout=300
  - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:viora-staging-db
  - --set-env-vars=APP_ENV=staging,DB_HOST=localhost,DB_SOCKET=/cloudsql/$PROJECT_ID:${_REGION}:viora-staging-db,DB_USER=viora_app,DB_NAME=viora_staging,DB_SESSION_ENABLED=true,ECF_ENABLED=false,PAYPAL_MODE=sandbox
  - --set-secrets=DB_PASSWORD=viora-staging-db-password:latest,PAYPAL_CLIENT_ID=viora-staging-paypal-client-id:latest,PAYPAL_CLIENT_SECRET=viora-staging-paypal-client-secret:latest,PAYPAL_PLAN_ID=viora-staging-paypal-plan-id:latest,GEMINI_API_KEY=viora-staging-gemini-api-key:latest
  - --add-volume=name=uploads,type=cloud-storage,bucket=$PROJECT_ID-staging-uploads,mount-options=uid=33;gid=33;file-mode=664;dir-mode=775
  - --add-volume-mount=volume=uploads,mount-path=/var/www/html/uploads
  - --add-volume=name=documents,type=cloud-storage,bucket=$PROJECT_ID-staging-documents,mount-options=uid=33;gid=33;file-mode=660;dir-mode=770
  - --add-volume-mount=volume=documents,mount-path=/var/www/viora_documentos_privados
  - --quiet
images:
- ${_REGION}-docker.pkg.dev/$PROJECT_ID/viora/web:${_IMAGE_TAG}
substitutions:
  _REGION: us-central1
  _IMAGE_TAG: manual
serviceAccount: projects/$PROJECT_ID/serviceAccounts/viora-build@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
